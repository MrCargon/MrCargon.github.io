<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MrCargon">
  <defs>
    <radialGradient id="planet" cx="38%" cy="35%">
      <stop offset="0%" stop-color="#FFD27F"/>
      <stop offset="55%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#C46A00"/>
    </radialGradient>
  </defs>
  <!-- Full-bleed background so the icon looks right under maskable (rounded) crops -->
  <rect width="512" height="512" fill="#0a0e14"/>
  <!-- Orbit ring -->
  <ellipse cx="256" cy="256" rx="152" ry="72" fill="none" stroke="#FFA500" stroke-width="10" opacity="0.5" transform="rotate(-25 256 256)"/>
  <!-- Planet (kept within the maskable safe zone) -->
  <circle cx="256" cy="256" r="92" fill="url(#planet)"/>
  <circle cx="224" cy="222" r="26" fill="#ffffff" opacity="0.22"/>
  <!-- Orbiting moon -->
  <circle cx="392" cy="210" r="14" fill="#FFE0A3"/>
</svg>
