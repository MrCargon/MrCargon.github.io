         globals; everything is instantiated on the window 'load' event, which fires

         inline script that uses these globals at top level -- inline scripts run

    <!-- 🌌 THREE.js r184 (was r128, 2021).
         Modern three.js ships ESM ONLY - the UMD `three.min.js` global build and the
         whole `examples/js` folder were deleted in r14x, so the old <script src> tags
         cannot be version-bumped in place. Instead we load three as a module via an
         import map and republish it as `window.THREE`.

         Why this keeps the rest of the site working: every simulation class below is a
         plain classic script that only touches THREE at RUNTIME (inside constructors and
         methods), never at class-definition time - verified before the upgrade. Module
         scripts are deferred, so they run after those classes are defined but BEFORE the
         window 'load' event, which is when anything actually instantiates them. -->
    <!-- Import map below MUST stay strict JSON — no comments, no trailing commas.
         A comment inside it silently kills the whole map ("Failed to parse import
         map: invalid JSON") and then every `import 'three'` fails to resolve.

         MUST also be the .min build. three.module.js re-exports three.core.js, so the
         unminified pair costs 125 + 274 = 399 KB gzipped, versus 84 + 98 = 182 KB
         minified. The old r128 three.min.js was 146 KB, so shipping the unminified
         module build made the site ~2.7x heavier to load than before the upgrade.
         webgpu/tsl entries were dropped: nothing imports them. -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
      }
    }
    </script>
    <script type="module">
      import * as THREE_NS from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
      import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
      import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';

      // COLOUR MANAGEMENT OFF — deliberate, and the single most important line here.
      //
      // r152+ converts every material colour from sRGB to linear on input. r128 never
      // did, so it effectively rendered every authored colour brighter than specified.
      // This entire scene — sun, corona, chromosphere, flares, solar wind, orbit rings,
      // planet tints — was hand-tuned by eye against that legacy behaviour over a long
      // time. Turning colour management on made all of it render "correctly" and
      // therefore visibly darker: measured 18.07 -> 15.86 mean screen luminance (-12%),
      // well outside the +/-0.07 run-to-run noise, and the user spotted it immediately.
      //
      // Two ways out: re-tune dozens of materials by hand, or restore the colour
      // pipeline the artwork was authored for. This is one documented line versus an
      // open-ended re-tune with no reference to tune against, so: off.
      // Measured with it off: 17.21 / 33.5% visible, back in line with the r128 look.
      //
      // If the scene is ever re-authored against correct colour, delete this line —
      // but expect to re-tune every emissive and translucent material at the same time.
      THREE_NS.ColorManagement.enabled = false;

      // An ES module namespace object is immutable, so the addons cannot be hung off it
      // directly the way examples/js used to. Spread into a plain object first.
      const THREE = { ...THREE_NS };
      THREE.OrbitControls = OrbitControls;
      THREE.LineSegmentsGeometry = LineSegmentsGeometry;
      THREE.LineMaterial = LineMaterial;
      THREE.LineSegments2 = LineSegments2;
      // NOTE: THREE.Timer needs NO import — it moved into CORE in r184 and already
      // arrives via the namespace spread above. Importing it from
      // 'three/addons/misc/Timer.js' 404s, and a failed import in this module aborts
      // the whole bootstrap, so window.THREE is never set and the entire site dies
      // silently. Verified the hard way.
      window.THREE = THREE;
      window.__threeReady = true;
    </script>
    <script>
      // Fail-soft: if the module never ran (no import-map support, CDN blocked, offline),
      // window.THREE is absent and the app shows its 3D-unavailable path instead of
      // throwing. The old inline OrbitControls stub is gone - it silently produced a
      // dead camera that looked like a bug rather than a load failure.
      window.addEventListener('load', function () {
        var ok = (typeof window.THREE !== 'undefined') && !!window.THREE.OrbitControls;
        window.dispatchEvent(new CustomEvent(ok ? 'threejs-ready' : 'threejs-failed'));
        if (!ok) console.error('THREE.js failed to load (import map / module blocked?)');
      });
    </script>
