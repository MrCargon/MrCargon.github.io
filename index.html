    <head>
        <meta charset="utf-8">
        <!-- No maximum-scale: pinch-zoom must stay available (WCAG 1.4.4). -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Defense-in-depth: restrict script/style/img origins. Allows the THREE CDNs + Unsplash project images currently in use. connect-src allows the keyless live-data feeds (ISS position + USGS earthquakes + NOAA SWPC Kp index for the aurora ovals) used by Explore mode.
             frame-src is set EXPLICITLY. The games are separate repos deployed to their own
             GitHub Pages URLs and embedded here in an iframe, and with no frame-src the
             browser falls back to default-src 'self'. That happens to pass on the live site,
             where those URLs are same-origin, and blocks them on every local dev server:
             "Framing 'https://mrcargon.github.io/' violates the following Content Security
             Policy directive: default-src 'self'". So the games could not be opened while
             developing, only in production. Naming the origin fixes that and documents what
             is actually allowed to be framed.
             #studio adds: player.twitch.tv (player), www.twitch.tv (chat embed lives there),
             www.youtube-nocookie.com (live player) to frame-src, and i.ytimg.com /
             static-cdn.jtvnw.net (video thumbnails) to img-src. Nothing loads from them until
             the visitor clicks Load on the Studio page or real items exist in content.json.
             script-src (roast R3 #7): NO 'unsafe-inline'. The page's own scripts are files
             ('self'); the one inline script left is the import map (browsers cannot load an
             import map from src), allowed by its sha256 - any edit to the map, even
             whitespace, changes that hash: re-run tests/verify-csp.cjs, it prints the new
             one. jsDelivr is allowed only under /npm/three@0.184.0/, not the whole host, and
             each of those files is pinned by sha384 in the import map's "integrity" block.
             No inline on*= handlers anywhere (they would need 'unsafe-inline' too); use
             addEventListener. style-src keeps 'unsafe-inline': hundreds of style="" attributes
             and JS-built inline styles; style injection is far lower risk than script.
             What a <meta> CSP CANNOT do (GitHub Pages sets no custom headers): frame-ancestors
             (clickjacking), report-uri/report-to, sandbox; and it only covers what is parsed
             after it, so it must stay the first thing in <head> after charset/viewport. -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-Fl+TmcXI5sFSwgB/UFZS3EpwzGC0Nvdf1WWlbeaQ83E=' https://cdn.jsdelivr.net/npm/three@0.184.0/; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.unsplash.com https://server.arcgisonline.com https://cartocdn-gusc.global.ssl.fastly.net https://trek.nasa.gov https://i.ytimg.com https://static-cdn.jtvnw.net; font-src 'self'; frame-src 'self' https://mrcargon.github.io https://player.twitch.tv https://www.twitch.tv https://www.youtube-nocookie.com; connect-src 'self' https://celestrak.org https://api.wheretheiss.at https://earthquake.usgs.gov https://services.swpc.noaa.gov https://tiles.openfreemap.org https://server.arcgisonline.com https://cartocdn-gusc.global.ssl.fastly.net https://trek.nasa.gov https://*.firebaseio.com https://*.firebasedatabase.app https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; base-uri 'self'; object-src 'none'; form-action 'self'">

    <!-- EVERY classic script below carries `defer`. Without it each one blocks HTML
         parsing and executes serially: 63 blocking scripts measured 7.2s to
         domInteractive and 12.9s before the loading screen cleared. defer lets them
         download in parallel while preserving execution order, so the dependency
         ordering below still holds. Safe because these files only DEFINE classes and
         globals; everything is instantiated on the window 'load' event, which fires
         after all deferred scripts have run. Do not remove it, and do not put an
         inline script that uses these globals at top level -- inline scripts run
         BEFORE deferred ones. -->
    <!-- Main Scripts -->
    <!-- FIRST: mutes 273 console.log calls in production. defer preserves

    <script src="src/utils/DebugLog.js" defer></script>

    <!-- Sine-wave procedural engine: shapes as Fourier series, audio as synthesis.

    <script src="src/utils/ForceMatrix.js" defer></script>
    <script src="src/utils/ParticleField3D.js" defer></script>
    <!-- Hydrogen orbitals: the third backdrop. Loads AFTER ParticleField3D because it
         reuses that file's generated dot sprite rather than making a second one. -->
    <script src="src/utils/OrbitalCloud.js" defer></script>
    <!-- Fourier-series creatures. Needs SineShape for the maths, OrbitalCloud for its
         hue helper and ForceMatrix for the linear-light conversion, so it loads last. -->
    <script src="src/utils/SineField.js" defer></script>
    <script src="src/utils/SafeFetch.js" defer></script>
    <!-- Round soft point sprites (CosmicDust, GeoLOD cities); before both users. -->

    <script src="src/utils/SatelliteTiles.js" defer></script>
    <!-- Live globe markers (places, quakes, ISS): one constant-pixel Points draw per layer.

    <!-- The Explore Earth engines (GeoLOD, mvt-decoder, StreetTiles, AtmosphereLayers,

         LazyBundles 'explore' brings them on the first Explore entry. SatelliteTiles
         stays, because Mars uses it outside Explore. -->
    <!-- Discord notify: contact form + calendar events -> Discord webhooks via

    <script src="src/utils/DiscordProxyConfig.js" defer></script>
    <script src="src/utils/DiscordNotify.js" defer></script>
    <!-- Page-specific bundles are NOT loaded here (roast R2 #7a). The Life page (Lenia,
         Conway, Particle Life, SineAudio), Studio, Calendar, Notes and the cosmology
         features load on first navigation / first use through LazyBundles, which keeps
         their order. The file lists live in LazyBundles.js; sw.js precaches the same
         files for offline use; tests/verify-lazy-bundles.cjs keeps all three in step. -->
    <script src="src/utils/LazyBundles.js" defer></script>

    <!-- 🌌 THREE.js r184 (was r128, 2021).
         Modern three.js ships ESM ONLY - the UMD `three.min.js` global build and the
         whole `examples/js` folder were deleted in r14x, so the old <script src> tags
         cannot be version-bumped in place. Instead we load three as a module via an
         import map and republish it as `window.THREE`.

         Why this keeps the rest of the site working: every simulation class below is a
         plain classic script that only touches THREE at RUNTIME (inside constructors and
         methods), never at class-definition time - verified before the upgrade. Module
         scripts are deferred, so they run after those classes are defined but BEFORE the
         window 'load' event, which is when anything actually instantiates them. -->
    <!-- Import map below MUST stay strict JSON — no comments, no trailing commas.
         A comment inside it silently kills the whole map ("Failed to parse import
         map: invalid JSON") and then every `import 'three'` fails to resolve.

         MUST also be the .min build. three.module.js re-exports three.core.js, so the
         unminified pair costs 125 + 274 = 399 KB gzipped, versus 84 + 98 = 182 KB
         minified. The old r128 three.min.js was 146 KB, so shipping the unminified
         module build made the site ~2.7x heavier to load than before the upgrade.
         webgpu/tsl entries were dropped: nothing imports them. -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
      },
      "integrity": {
        "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.min.js": "sha384-35WaVqXNGvw49+RCXk67Ci9ebo55/5+CfirDbAVSG21KV8/7gO4xwIkhA5ZRcUHc",
        "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.core.min.js": "sha384-/2vXInuUL2LKgd3n86c5RIzG+YC7vk3zYPTknaEkF2H2sauHtaOrS8swZ+MURxU6",
        "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
        "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/lines/LineSegmentsGeometry.js": "sha384-c1W/XWY1D45CznDDaXT87QmzD1YKNwYHvQegG8dXjCyf5ZaKzaWqEUwHZTYfBw64",
        "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/lines/LineMaterial.js": "sha384-8Um0dXKMKJBH05T/knjq7XGT8VQcEL9/pqss6E/fhjEUjoCL/XdSYq+cEesJOq6q",
        "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/lines/LineSegments2.js": "sha384-n2jaM7+4eslyq1tO0fUEd4NE5Aaux4lCKN6+IUAAs00Wo49rmzxXm4pVNzA+wzjN"
      }
    }
    </script>
    <script type="module" src="src/three-boot.js"></script>
